<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17130d">
  <title>Festa da Família Oliveira | Contagem Regressiva</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --brown: #6f3218;
      --brown-dark: #3b190d;
      --ink: #17130d;
      --cream: #f4dfb5;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #17130d;
    }

    body {
      width: 100%;
      font-family: "Roboto Slab", Georgia, serif;
    }

    /*
      VERSÃO MOBILE
      A página acompanha exatamente a proporção da arte:
      953 x 1650
    */
    .page {
      position: relative;
      width: 100%;
      max-width: 953px;
      margin: 0 auto;
      line-height: 1;
      overflow: hidden;
    }

    .poster {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      pointer-events: none;
    }

    /*
      BLOCO DO CONTADOR
      A posição é relativa à própria imagem.
      top: 28% coloca o número de dias entre os risquinhos.
    */
    .counter {
      position: absolute;
      top: 28%;
      left: 50%;
      width: 100%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 2;
      pointer-events: none;
    }

    /* NÚMERO PRINCIPAL DE DIAS */
    .days {
      margin: 0;
      font-size: clamp(72px, 17vw, 110px);
      line-height: .82;
      font-weight: 900;
      letter-spacing: -.075em;
      color: var(--brown);
      -webkit-text-stroke: 1px rgba(55, 23, 10, .48);
      text-shadow:
        0 1px 0 rgba(255,255,255,.30),
        0 2px 0 rgba(88,35,14,.75),
        0 4px 7px rgba(0,0,0,.40),
        0 8px 14px rgba(0,0,0,.22);
    }

    /* PALAVRA DIA / DIAS */
    .days-label {
      margin-top: 6px;
      font-size: clamp(14px, 3.4vw, 25px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: .10em;
      color: var(--ink);
      text-shadow:
        0 1px 0 rgba(255,255,255,.32),
        0 2px 4px rgba(0,0,0,.18);
    }

    /* HORAS / MINUTOS / SEGUNDOS */
    .time {
      width: min(68%, 520px);
      margin: clamp(26px, 6vw, 48px) auto 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      align-items: start;
    }

    .unit {
      position: relative;
      min-width: 0;
      padding: 0 clamp(4px, 1.2vw, 10px);
    }

    .unit + .unit::before {
      content: "";
      position: absolute;
      left: 0;
      top: 10%;
      width: 2px;
      height: 72%;
      background: linear-gradient(
        to bottom,
        transparent,
        rgba(111,50,24,.85),
        transparent
      );
      box-shadow: 1px 0 2px rgba(255,255,255,.15);
    }

    /* NÚMEROS PEQUENOS */
    .num {
      display: block;
      font-size: clamp(25px, 6.2vw, 48px);
      line-height: .9;
      font-weight: 900;
      letter-spacing: -.04em;
      color: var(--brown);
      -webkit-text-stroke: .7px rgba(55,23,10,.42);
      text-shadow:
        0 1px 0 rgba(255,255,255,.25),
        0 2px 0 rgba(88,35,14,.62),
        0 4px 7px rgba(0,0,0,.35);
    }

    /* HORAS / MINUTOS / SEGUNDOS */
    .label {
      display: block;
      margin-top: 7px;
      font-size: clamp(8px, 2.15vw, 16px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: .015em;
      color: var(--ink);
      white-space: nowrap;
      text-shadow:
        0 1px 0 rgba(255,255,255,.30),
        0 2px 3px rgba(0,0,0,.18);
    }

    /* Ajuste fino para telas muito estreitas */
    @media (max-width: 380px) {
      .counter {
        top: 27.8%;
      }

      .time {
        width: 72%;
      }

      .days {
        font-size: 17vw;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <!-- TROQUE AQUI SE O NOME DO ARQUIVO DA ARTE FOR OUTRO -->
    <img
      class="poster"
      src="arte-vertical.png"
      alt="Festa da Família Oliveira"
    >

    <section class="counter" aria-live="polite">
      <div id="days" class="days">--</div>
      <div id="daysLabel" class="days-label">DIAS</div>

      <div class="time">
        <div class="unit">
          <span id="hours" class="num">00</span>
          <span class="label">Horas</span>
        </div>

        <div class="unit">
          <span id="minutes" class="num">00</span>
          <span class="label">Minutos</span>
        </div>

        <div class="unit">
          <span id="seconds" class="num">00</span>
          <span class="label">Segundos</span>
        </div>
      </div>
    </section>
  </main>

  <script>
    /*
      Festa:
      06/09/2026 às 00:00
      Horário de Brasília (-03:00)
    */
    const target = new Date("2026-09-06T00:00:00-03:00").getTime();

    const $ = id => document.getElementById(id);

    function pad(value) {
      return String(value).padStart(2, "0");
    }

    function updateCountdown() {
      let diff = Math.max(0, target - Date.now());

      const DAY = 86400000;
      const HOUR = 3600000;
      const MINUTE = 60000;

      const days = Math.floor(diff / DAY);
      diff %= DAY;

      const hours = Math.floor(diff / HOUR);
      diff %= HOUR;

      const minutes = Math.floor(diff / MINUTE);
      const seconds = Math.floor((diff % MINUTE) / 1000);

      $("days").textContent = days;
      $("daysLabel").textContent = days === 1 ? "DIA" : "DIAS";
      $("hours").textContent = pad(hours);
      $("minutes").textContent = pad(minutes);
      $("seconds").textContent = pad(seconds);
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
