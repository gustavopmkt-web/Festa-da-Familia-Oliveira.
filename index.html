    <style>

        /* ==================================================
           PALETA
           ================================================== */

        :root {

            --brown: #6f3218;

            --brown-dark: #3b190d;

            --ink: #17130d;

        }


        /* ==================================================
           RESET
           ================================================== */

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            padding: 0;

            background: #17130d;

        }


        body {

            width: 100%;

            font-family:
                "Roboto Slab",
                Georgia,
                serif;

        }


        /* ==================================================
           PÁGINA
           ================================================== */

        .page {

            position: relative;

            width: 100%;

            max-width: 1024px;

            margin: 0 auto;

            overflow: hidden;

            line-height: 1;

        }


        /* ==================================================
           ARTE PRINCIPAL

           Para trocar a arte no futuro:
           basta substituir o arquivo

           arte-vertical.png
           ================================================== */

        .poster {

            display: block;

            width: 100%;

            height: auto;

            user-select: none;

            pointer-events: none;

        }


        /* ==================================================
           CONTADOR

           POSIÇÃO:
           abaixo de "É AMANHÃ!"
           acima do logo.

           O contador é horizontal.
           ================================================== */

        .counter {

            position: absolute;

            top: 32.2%;

            left: 50%;

            width: 67%;

            transform: translateX(-50%);

            z-index: 2;

            pointer-events: none;

        }


        /* ==================================================
           LINHA DOS TRÊS TEMPOS
           ================================================== */

        .time {

            width: 100%;

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            align-items: start;

        }


        /* ==================================================
           CADA UNIDADE
           ================================================== */

        .unit {

            position: relative;

            min-width: 0;

            text-align: center;

            padding: 0 8px;

        }


        /* ==================================================
           SEPARADORES VERTICAIS
           ================================================== */

        .unit + .unit::before {

            content: "";

            position: absolute;

            left: 0;

            top: 8%;

            width: 2px;

            height: 78%;

            background:
                linear-gradient(
                    to bottom,
                    transparent,
                    rgba(111,50,24,.85),
                    transparent
                );

            box-shadow:
                1px 0 2px
                rgba(255,255,255,.15);

        }


        /* ==================================================
           NÚMEROS
           ================================================== */

        .num {

            display: block;

            margin: 0;

            font-size:
                clamp(
                    34px,
                    6vw,
                    62px
                );

            line-height: .86;

            font-weight: 900;

            letter-spacing: -.055em;

            color: var(--brown);


            -webkit-text-stroke:
                1px
                rgba(55,23,10,.48);


            text-shadow:

                0 1px 0
                rgba(255,255,255,.30),

                0 2px 0
                rgba(88,35,14,.75),

                0 4px 7px
                rgba(0,0,0,.40),

                0 8px 14px
                rgba(0,0,0,.22);

        }


        /* ==================================================
           HORAS / MINUTOS / SEGUNDOS
           ================================================== */

        .label {

            display: block;

            margin-top: 7px;

            font-size:
                clamp(
                    10px,
                    1.9vw,
                    17px
                );

            line-height: 1;

            font-weight: 900;

            letter-spacing: .01em;

            color: var(--ink);

            white-space: nowrap;


            text-shadow:

                0 1px 0
                rgba(255,255,255,.30),

                0 2px 3px
                rgba(0,0,0,.18);

        }


        /* ==================================================
           CELULAR
           ================================================== */

        @media (max-width: 600px) {

            .counter {

                top: 32.1%;

                width: 69%;

            }


            .num {

                font-size: 6.8vw;

            }


            .label {

                font-size: 2vw;

            }

        }


        /* ==================================================
           TELAS MUITO PEQUENAS
           ================================================== */

        @media (max-width: 380px) {

            .counter {

                top: 32%;

                width: 72%;

            }


            .unit {

                padding: 0 4px;

            }


            .num {

                font-size: 7.2vw;

            }


            .label {

                font-size: 2.2vw;

            }

        }

    </style>

</head>


<body>


    <main class="page">


        <!-- =================================================
             ARTE
             ================================================= -->

        <img
            class="poster"
            src="arte-vertical.png"
            alt="Festa da Família Oliveira"
        >


        <!-- =================================================
             CONTADOR
             
             SOMENTE:
             HORAS
             MINUTOS
             SEGUNDOS

             O "2" DE DIAS ESTÁ INCORPORADO NA ARTE.
             ================================================= -->

        <section
            class="counter"
            aria-live="polite"
        >

            <div class="time">


                <!-- HORAS -->

                <div class="unit">

                    <span
                        id="hours"
                        class="num"
                    >
                        00
                    </span>

                    <span
                        class="label"
                    >
                        Horas
                    </span>

                </div>


                <!-- MINUTOS -->

                <div class="unit">

                    <span
                        id="minutes"
                        class="num"
                    >
                        00
                    </span>

                    <span
                        class="label"
                    >
                        Minutos
                    </span>

                </div>


                <!-- SEGUNDOS -->

                <div class="unit">

                    <span
                        id="seconds"
                        class="num"
                    >
                        00
                    </span>

                    <span
                        class="label"
                    >
                        Segundos
                    </span>

                </div>


            </div>

        </section>


    </main>


    <!-- =====================================================
         CONTADOR
         ===================================================== -->

    <script>

        /*
        ======================================================
        DATA DA FESTA

        06/09/2026 às 00:00
        Horário de Brasília (-03:00)
        ======================================================
        */

        const target =
            new Date(
                "2026-09-06T00:00:00-03:00"
            ).getTime();


        /*
        ======================================================
        ELEMENTOS
        ======================================================
        */

        const $ = id =>
            document.getElementById(id);


        /*
        ======================================================
        FORMATAÇÃO
        ======================================================
        */

        function pad(value) {

            return String(value)
                .padStart(2, "0");

        }


        /*
        ======================================================
        ATUALIZAÇÃO DO CONTADOR
        ======================================================
        */

        function updateCountdown() {

            let diff =
                Math.max(
                    0,
                    target - Date.now()
                );


            const DAY =
                86400000;

            const HOUR =
                3600000;

            const MINUTE =
                60000;


            /*
            --------------------------------------------------
            DIAS

            O número é calculado porque precisamos retirar
            os dias da diferença.

            Ele NÃO é exibido pelo código.

            O "2" gigante existente na arte representa
            visualmente os dias.
            --------------------------------------------------
            */

            const days =
                Math.floor(diff / DAY);


            /*
            Remove os dias completos
            */

            diff -=
                days * DAY;


            /*
            --------------------------------------------------
            HORAS
            --------------------------------------------------
            */

            const hours =
                Math.floor(diff / HOUR);


            diff -=
                hours * HOUR;


            /*
            --------------------------------------------------
            MINUTOS
            --------------------------------------------------
            */

            const minutes =
                Math.floor(diff / MINUTE);


            diff -=
                minutes * MINUTE;


            /*
            --------------------------------------------------
            SEGUNDOS
            --------------------------------------------------
            */

            const seconds =
                Math.floor(diff / 1000);


            /*
            --------------------------------------------------
            ATUALIZA A TELA
            --------------------------------------------------
            */

            $("hours").textContent =
                pad(hours);

            $("minutes").textContent =
                pad(minutes);

            $("seconds").textContent =
                pad(seconds);

        }


        /*
        PRIMEIRA EXECUÇÃO
        */

        updateCountdown();


        /*
        ATUALIZA A CADA SEGUNDO
        */

        setInterval(
            updateCountdown,
            1000
        );

    </script>
